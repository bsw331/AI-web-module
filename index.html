<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fc">
<title>知问 · AI 助手</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#20233a;background:#f7f8fc;--purple:#6d5ce8;--line:#e9eaf1;--muted:#85899c}
*{box-sizing:border-box}body{margin:0;min-width:320px;height:100vh;height:100dvh;overflow:hidden}button,input,textarea{font:inherit}button{color:inherit}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}.sidebar{display:flex;flex-direction:column;padding:26px 16px 18px;background:white;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px;margin-bottom:30px;font-size:19px;font-weight:750;letter-spacing:-.5px}.brand-mark{display:grid;width:34px;height:34px;place-items:center;color:#fff;background:linear-gradient(145deg,#8b7bff,#5f4ce0);border-radius:12px;box-shadow:0 5px 12px #7664e63b}.brand-mark svg{width:19px}
.new-chat{display:flex;align-items:center;justify-content:center;gap:9px;height:43px;color:#fff;font-size:13px;font-weight:650;background:var(--purple);border:0;border-radius:12px;box-shadow:0 5px 12px #6d5ce82b;cursor:pointer;transition:.2s}.new-chat:hover{background:#5847d1;transform:translateY(-1px)}.new-chat svg{width:17px}
.side-label{padding:0 10px;margin:29px 0 10px;color:#a0a3b2;font-size:10px;font-weight:700;letter-spacing:1.1px}.history-empty{padding:9px 10px;color:#a0a3b2;font-size:12px;line-height:1.7}.sidebar-spacer{flex:1}.side-note{padding:13px;color:#777b91;background:#f7f6ff;border:1px solid #eeebff;border-radius:12px;font-size:11px;line-height:1.65}.side-note strong{display:block;margin-bottom:3px;color:#5549a5;font-size:12px}
.main{display:flex;min-width:0;flex-direction:column;background:radial-gradient(ellipse at 50% 0,#f1efff 0,transparent 39%),#f7f8fc}.topbar{display:flex;flex-shrink:0;align-items:center;justify-content:space-between;height:69px;padding:0 34px;background:#ffffffb8;border-bottom:1px solid #ececf2;backdrop-filter:blur(14px)}.model-line,.top-actions{display:flex;align-items:center;gap:9px}.model-name{font-size:13px;font-weight:700}.model-tag{padding:4px 8px;color:#78758d;background:#f1f0f7;border-radius:6px;font-size:10px}.top-actions{gap:10px}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.status-dot{width:7px;height:7px;background:#b7bac7;border-radius:50%}.status.connected .status-dot{background:#35b881;box-shadow:0 0 0 3px #35b88120}.status.busy .status-dot{background:#eea544}
.settings-button{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 11px;color:#55596f;background:white;border:1px solid var(--line);border-radius:9px;font-size:11px;font-weight:600;cursor:pointer;transition:.2s}.settings-button:hover{color:var(--purple);border-color:#c9c1ff}.settings-button svg{width:15px;height:15px}.language-button{min-width:40px;justify-content:center;padding:0 9px;font-weight:700}
.conversation{width:min(810px,100%);min-height:0;flex:1;align-self:center;overflow:auto;padding:32px 28px 20px;scrollbar-color:#d7d8e2 transparent;scrollbar-width:thin}.welcome{display:flex;min-height:100%;flex-direction:column;align-items:center;justify-content:center;padding-bottom:30px;text-align:center}.welcome-icon{display:grid;width:62px;height:62px;place-items:center;margin-bottom:19px;color:var(--purple);background:#eeebff;border:1px solid #e6e1ff;border-radius:21px}.welcome-icon svg{width:29px;height:29px}.welcome h1{margin:0;font-size:clamp(24px,3vw,31px);letter-spacing:-1px}.welcome>p{max-width:390px;margin:11px 0 27px;color:var(--muted);font-size:13px;line-height:1.8}
.suggestions{display:grid;width:min(100%,570px);grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:left}.suggestion{min-height:74px;padding:13px 15px;background:#ffffffc9;border:1px solid #e9e9f1;border-radius:12px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}.suggestion:hover{transform:translateY(-2px);border-color:#cbc4ff;box-shadow:0 7px 20px #5544bb0d}.suggestion strong{display:block;margin-bottom:5px;font-size:12px;font-weight:650}.suggestion span{color:var(--muted);font-size:11px}
.messages{display:flex;flex-direction:column;gap:25px;padding:7px 0 20px}.message{display:flex;gap:11px;align-items:flex-start}.message.user{flex-direction:row-reverse}.avatar{display:grid;width:31px;height:31px;flex:0 0 31px;place-items:center;color:var(--purple);background:#eeebff;border-radius:11px}.avatar svg{width:17px;height:17px}.user .avatar{color:#fff;background:#a5a8b7;font-size:12px;font-weight:700}.message-content{max-width:min(82%,650px)}.message.user .message-content{text-align:right}.message-label{margin:1px 0 6px;color:#9295a5;font-size:10px}.bubble{padding:12px 15px;color:#3b3e52;background:white;border:1px solid #ececf2;border-radius:4px 14px 14px;box-shadow:0 3px 12px #28284906;font-size:13px;line-height:1.75;text-align:left;overflow-wrap:anywhere;white-space:pre-wrap}.message.user .bubble{color:#fff;background:var(--purple);border-color:var(--purple);border-radius:14px 4px 14px 14px}.message.error .bubble{color:#a33b45;background:#fff6f6;border-color:#f4d8da}.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:5px;height:5px;background:#9a92d5;border-radius:50%;animation:pulse 1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes pulse{50%{opacity:.35;transform:translateY(-3px)}}
.composer-wrap{flex-shrink:0;padding:10px 24px 18px;background:linear-gradient(0deg,#f7f8fc 82%,#f7f8fc00)}.composer{display:flex;width:min(760px,100%);min-height:58px;align-items:flex-end;gap:10px;margin:0 auto;padding:10px 10px 10px 17px;background:#fff;border:1px solid #e4e4ed;border-radius:16px;box-shadow:0 7px 25px #29294e0c;transition:.2s}.composer:focus-within{border-color:#bdb3ff;box-shadow:0 0 0 3px #6d5ce812,0 7px 25px #29294e0c}.composer textarea{width:100%;min-height:35px;max-height:150px;resize:none;padding:8px 0 5px;color:#20233a;background:transparent;border:0;outline:0;font-size:13px;line-height:1.5}.composer textarea::placeholder{color:#a5a7b5}
.send-button{display:grid;width:37px;height:37px;flex:0 0 37px;place-items:center;color:#fff;background:var(--purple);border:0;border-radius:11px;cursor:pointer;transition:.2s}.send-button:hover:not(:disabled){background:#5847d1;transform:translateY(-1px)}.send-button:disabled{background:#c9c6d9;cursor:not-allowed}.send-button svg{width:17px;height:17px}.hint{margin:10px auto 0;color:#a2a4b1;font-size:10px;text-align:center}
.modal-backdrop{position:fixed;z-index:5;inset:0;display:grid;place-items:center;padding:18px;background:#22223870;backdrop-filter:blur(5px)}.modal-backdrop[hidden]{display:none}.modal{width:min(100%,460px);padding:25px;background:#fff;border:1px solid #ffffff80;border-radius:18px;box-shadow:0 20px 70px #17172a33;animation:appear .18s ease-out}@keyframes appear{from{opacity:0;transform:translateY(7px) scale(.99)}}
.modal-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:19px}.modal-heading h2{margin:0 0 5px;font-size:18px;letter-spacing:-.4px}.modal-heading p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}.close-button{display:grid;width:30px;height:30px;flex:0 0 30px;place-items:center;color:#888b9c;background:#f6f6f9;border:0;border-radius:9px;cursor:pointer}.close-button:hover{color:#20233a;background:#eeeef4}.close-button svg{width:15px;height:15px}
.field{margin-top:15px}.field label{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px;color:#484b60;font-size:11px;font-weight:650}.field label span{color:#9a9cab;font-size:10px;font-weight:400}.field input{width:100%;height:39px;padding:0 11px;color:#20233a;background:#fbfbfd;border:1px solid #e5e5ed;border-radius:9px;outline:0;font-size:12px;transition:.2s}.field input:focus{border-color:#bcb2ff;box-shadow:0 0 0 3px #6d5ce812}.field input::placeholder{color:#b0b2bd}.key-row{display:flex;gap:7px}.key-row input{min-width:0}.reveal-button{padding:0 11px;color:#777b91;background:#f5f5f9;border:1px solid #e7e7ef;border-radius:9px;font-size:11px;cursor:pointer}.reveal-button:hover{color:var(--purple)}.modal-note{margin:14px 0 0;padding:10px 11px;color:#777b91;background:#f7f7fb;border-radius:9px;font-size:10px;line-height:1.6}.modal-error{min-height:16px;margin-top:10px;color:#bd4750;font-size:11px}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.modal-footer button{height:36px;padding:0 14px;border-radius:9px;font-size:11px;font-weight:650;cursor:pointer}.cancel-button{color:#696c80;background:#fff;border:1px solid #e6e6ed}.save-button{color:#fff;background:var(--purple);border:1px solid var(--purple)}.save-button:hover{background:#5847d1}.toast{position:fixed;z-index:10;bottom:96px;left:50%;padding:9px 14px;color:#fff;background:#303044e8;border-radius:9px;font-size:11px;transform:translateX(-50%)}.toast[hidden]{display:none}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{height:59px;padding:0 16px}.conversation{padding:24px 16px 14px}.composer-wrap{padding:8px 12px 12px}.status{display:none}.welcome{padding-bottom:12px}.suggestions{gap:8px}.suggestion{min-height:70px;padding:11px}.suggestion span{font-size:10px}.message-content{max-width:86%}}
@media(max-width:390px){.model-tag{display:none}.suggestions{grid-template-columns:1fr}.suggestion{min-height:auto}.welcome>p{margin-bottom:19px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.2 13.9 9l5.8 1.9-5.8 1.9-1.9 5.8-1.9-5.8-5.8-1.9L10.1 9 12 3.2Z" fill="currentColor"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z" fill="currentColor"/></svg></span><span id="brandName">知问</span></div>
    <button class="new-chat" id="newChatButton" type="button"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="newChatLabel">开启新对话</span></button>
    <div class="side-label" id="historyTitle">最近对话</div><div class="history-empty" id="historyEmpty">开启对话后，聊天内容会显示在这里。</div><div class="sidebar-spacer"></div>
    <div class="side-note"><strong id="sideNoteTitle">你的 AI 对话空间</strong><span id="sideNoteText">填写 API 配置后，即可开始与 AI 自由交流。</span></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="model-line"><span class="model-name" id="headerModel">AI 助手</span><span class="model-tag" id="modelTag">对话模式</span></div>
      <div class="top-actions"><div class="status" id="connectionStatus"><span class="status-dot"></span><span id="statusText">尚未配置</span></div>
        <button class="settings-button language-button" id="languageToggle" type="button" aria-label="Switch to English">EN</button>
        <button class="settings-button" id="openSettings" type="button"><svg viewBox="0 0 24 24" fill="none"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.7"/><path d="m19.4 13.5 1.1.9-1.1 1.9-1.4-.5a7.8 7.8 0 0 1-1.4.8l-.3 1.5h-2.2l-.4-1.5a7.8 7.8 0 0 1-1.5-.6l-1.3.8-1.6-1.5.7-1.3a7.8 7.8 0 0 1-.6-1.5l-1.5-.4V9.9l1.5-.4a7.8 7.8 0 0 1 .6-1.5l-.8-1.3 1.6-1.5 1.3.8a7.8 7.8 0 0 1 1.5-.6l.4-1.5h2.2l.3 1.5a7.8 7.8 0 0 1 1.4.8l1.4-.5 1.1 1.9-1.1.9a7.8 7.8 0 0 1 0 1.8Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" transform="translate(-1 -1) scale(1.05)"/></svg><span id="settingsButtonLabel">API 设置</span></button></div>
    </header>
    <section class="conversation" id="conversation" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="welcome-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.8 14.4 9.6 21.2 12l-6.8 2.4L12 21.2l-2.4-6.8L2.8 12l6.8-2.4L12 2.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m19 2 .7 2.3L22 5l-2.3.7L19 8l-.7-2.3L16 5l2.3-.7L19 2Z" fill="currentColor"/></svg></div>
        <h1 id="welcomeTitle">你好，今天想聊些什么？</h1><p id="welcomeText">我是你的 AI 助手，可以陪你探索想法、解决问题，也能帮你把灵感变成行动。</p>
        <div class="suggestions">
          <button class="suggestion" type="button" data-prompt-zh="帮我制定一个高效又容易坚持的每周学习计划。" data-prompt-en="Help me create an effective weekly study plan that's easy to stick to."><strong id="suggestion1Title">📚 制定学习计划</strong><span id="suggestion1Text">安排一份清晰可执行的每周计划</span></button>
          <button class="suggestion" type="button" data-prompt-zh="给我一些适合周末尝试的新点子，最好有创意又不太花钱。" data-prompt-en="Suggest some creative, budget-friendly ideas to try this weekend."><strong id="suggestion2Title">💡 寻找灵感点子</strong><span id="suggestion2Text">为平凡的周末添一点新鲜感</span></button>
          <button class="suggestion" type="button" data-prompt-zh="用通俗易懂的方式，给我解释一下什么是人工智能。" data-prompt-en="Explain what artificial intelligence is in simple, easy-to-understand terms."><strong id="suggestion3Title">🧠 解释一个概念</strong><span id="suggestion3Text">把复杂知识讲得简单又有趣</span></button>
          <button class="suggestion" type="button" data-prompt-zh="帮我写一封礼貌、简洁的邮件，向同事确认本周会议时间。" data-prompt-en="Help me write a polite, concise email asking a colleague to confirm this week's meeting time."><strong id="suggestion4Title">✍️ 润色一段文字</strong><span id="suggestion4Text">让表达更清楚，也更得体</span></button>
        </div>
      </div>
      <div class="messages" id="messages" hidden></div>
    </section>
    <div class="composer-wrap"><form class="composer" id="chatForm"><textarea id="messageInput" rows="1" aria-label="输入消息" placeholder="发送消息给 AI 助手..." autocomplete="off"></textarea>
      <button class="send-button" id="sendButton" type="submit" aria-label="发送消息"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form>
      <div class="hint" id="composerHint">AI 生成的内容仅供参考 · Enter 发送，Shift + Enter 换行</div></div>
  </main>
</div>
<div class="modal-backdrop" id="settingsBackdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="modal-heading"><div><h2 id="settingsTitle">连接你的 AI 模型</h2><p id="settingsDescription">配置 OpenAI 兼容的聊天接口，保存后即可开始对话。</p></div>
    <button class="close-button" id="closeSettings" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
  <form id="settingsForm">
    <div class="field"><label for="apiKey">API Key <span id="keyNote">仅在当前页面使用，不会保存到浏览器</span></label><div class="key-row"><input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false"><button class="reveal-button" id="toggleKey" type="button">显示</button></div></div>
    <div class="field"><label for="modelInput" id="modelLabel">模型名称</label><input id="modelInput" type="text" placeholder="例如：gpt-4o-mini" value="gpt-4o-mini" autocomplete="off" spellcheck="false" required></div>
    <div class="field"><label for="endpointInput"> <span id="endpointLabel">API 地址</span><span id="endpointNote">OpenAI 兼容格式</span></label><input id="endpointInput" type="url" placeholder="https://api.openai.com/v1/chat/completions" value="https://api.openai.com/v1/chat/completions" autocomplete="url" required></div>
    <div class="modal-note" id="securityNote">API Key 只保存在当前页面内存中，刷新或关闭页面后会清除。请确认你的服务商允许浏览器跨域请求（CORS）；不要在公用设备或不可信页面中输入密钥。</div>
    <div class="modal-error" id="settingsError" role="alert"></div><div class="modal-footer"><button class="cancel-button" id="cancelSettings" type="button">取消</button><button class="save-button" id="saveSettingsLabel" type="submit">保存并开始</button></div>
  </form></section></div><div class="toast" id="toast" role="status" hidden></div>

      hint: "AI-generated content is for reference only · Enter to send, Shift + Enter for a new line",
      settingsTitle: "Connect your AI model", settingsDescription: "Configure an OpenAI-compatible chat API to get started.",
      keyNote: "Used on this page only; never saved in your browser", modelLabel: "Model name", modelPlaceholder: "e.g. gpt-4o-mini",
      endpointLabel: "API endpoint", endpointNote: "OpenAI-compatible format",
      securityNote: "Your API key is kept in page memory only and cleared when you refresh or close this page. Make sure your provider allows browser requests (CORS). Do not enter your key on shared devices or untrusted pages.",
      reveal: "Show", hide: "Hide", cancel: "Cancel", saveSettings: "Save and start",
      switchLanguage: "切换到中文", close: "Close", send: "Send message", user: "You", connectedToast: "Settings saved. You're ready to chat.",
      missingKey: "Enter your API key and save the settings first.", requiredKey: "Please enter an API key.",
      requiredModel: "Please enter a model name.", invalidEndpoint: "The API endpoint must start with http:// or https://.",
      requestFailed: (status) => `Request failed (HTTP ${status})`,
      noResponseStream: "The browser cannot read the response stream. Try an endpoint that supports streaming.",
      modelEmpty: "The model returned no content. Check the model name and API settings.",
      connectionError: "Could not connect. Check the API endpoint, network, and your provider's CORS settings.",
      unknownError: "An unexpected error occurred. Check your API settings and try again.",
      thinking: "AI is thinking", newChatBusy: "Wait for the current response to finish before starting a new chat"
    }
  };
  const t = (key, ...args) => {
    const value = translations[language][key];
    return typeof value === "function" ? value(...args) : value;
  };
  modelInput.value = model;
  endpointInput.value = endpoint;
  const assistantIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.2 13.9 9l5.8 1.9-5.8 1.9-1.9 5.8-1.9-5.8-5.8-1.9L10.1 9 12 3.2Z" fill="currentColor"/></svg>';

  function setLanguage(nextLanguage) {
    language = nextLanguage;
    const copy = translations[language];
    document.documentElement.lang = language === "en" ? "en" : "zh-CN";
    document.title = copy.title;
    $("#brandName").textContent = copy.brandName;
    $("#newChatLabel").textContent = copy.newChat;
    $("#historyTitle").textContent = copy.historyTitle;
    $("#historyEmpty").textContent = copy.historyEmpty;
    $("#sideNoteTitle").textContent = copy.sideNoteTitle;
    $("#sideNoteText").textContent = copy.sideNoteText;
    $("#modelTag").textContent = copy.mode;
    $("#settingsButtonLabel").textContent = copy.settings;
    $("#welcomeTitle").textContent = copy.welcomeTitle;
    $("#welcomeText").textContent = copy.welcomeText;
    copy.suggestions.forEach(([title, description], index) => {
      $(`#suggestion${index + 1}Title`).textContent = title;
      $(`#suggestion${index + 1}Text`).textContent = description;
    });
    document.querySelectorAll(".suggestion").forEach((button) => {
      button.dataset.prompt = button.dataset[`prompt${language === "en" ? "En" : "Zh"}`];
    });
    input.placeholder = copy.placeholder;
    input.setAttribute("aria-label", copy.messageLabel);
    $("#composerHint").textContent = copy.hint;
    $("#settingsTitle").textContent = copy.settingsTitle;
    $("#settingsDescription").textContent = copy.settingsDescription;
    $("#keyNote").textContent = copy.keyNote;
    $("#modelLabel").textContent = copy.modelLabel;
    modelInput.placeholder = copy.modelPlaceholder;
    $("#endpointLabel").textContent = copy.endpointLabel;
    $("#endpointNote").textContent = copy.endpointNote;
    $("#securityNote").textContent = copy.securityNote;
    $("#toggleKey").textContent = keyInput.type === "text" ? copy.hide : copy.reveal;
    $("#cancelSettings").textContent = copy.cancel;
    $("#saveSettingsLabel").textContent = copy.saveSettings;
    $("#languageToggle").textContent = language === "zh" ? "EN" : "中文";
    $("#languageToggle").setAttribute("aria-label", copy.switchLanguage);
    $("#closeSettings").setAttribute("aria-label", copy.close);
    sendButton.setAttribute("aria-label", copy.send);
    document.querySelectorAll(".message").forEach((message) => {
      message.querySelector(".message-label").textContent = message.classList.contains("user") ? copy.user : model;
      if (message.classList.contains("user")) message.querySelector(".avatar").textContent = language === "en" ? "Y" : "我";
    });
    localStorage.setItem("zhiwen-language", language);
    updateHeader();
  }

  function updateHeader() {
    $("#headerModel").textContent = model || t("assistant");
    status.classList.toggle("connected", Boolean(apiKey));
    status.classList.toggle("busy", busy);
    statusText.textContent = busy ? t("busy") : apiKey ? t("configured") : t("unconfigured");
  }
  function openSettings() {
    modelInput.value = model;
    endpointInput.value = endpoint;
    keyInput.value = apiKey;
    settingsError.textContent = "";
    backdrop.hidden = false;
    window.setTimeout(() => (apiKey ? modelInput : keyInput).focus(), 0);
  }
  function closeSettings() { backdrop.hidden = true; settingsError.textContent = ""; }
  function showToast(message) {
    const toast = $("#toast"); toast.textContent = message; toast.hidden = false;
    window.clearTimeout(toastTimer); toastTimer = window.setTimeout(() => { toast.hidden = true; }, 2300);
  }
  function addMessage(role, text, options = {}) {
    welcome.hidden = true; messagesEl.hidden = false;
    const item = document.createElement("article");
    item.className = `message ${role === "user" ? "user" : "assistant"}${options.error ? " error" : ""}`;
    const avatar = document.createElement("div"); avatar.className = "avatar";
    if (role === "user") avatar.textContent = language === "en" ? "Y" : "我"; else avatar.innerHTML = assistantIcon;
    const content = document.createElement("div"); content.className = "message-content";
    const label = document.createElement("div"); label.className = "message-label"; label.textContent = role === "user" ? t("user") : model;
    const bubble = document.createElement("div"); bubble.className = "bubble";
    if (options.typing) bubble.innerHTML = `<span class="typing" aria-label="${t("thinking")}"><i></i><i></i><i></i></span>`;
    else bubble.textContent = text;
    content.append(label, bubble); item.append(avatar, content); messagesEl.append(item);
    conversation.scrollTop = conversation.scrollHeight;
    return { item, bubble };
  }
  function setBusy(value) { busy = value; sendButton.disabled = value; input.disabled = value; updateHeader(); }
  function validateEndpoint(value) {
    let url;
    try { url = new URL(value); }
    catch { throw new Error(t("invalidEndpoint")); }
    if (!["http:", "https:"].includes(url.protocol)) throw new Error(t("invalidEndpoint"));
    return url.toString();
  }
  function parseError(data, fallback) { return data?.error?.message || data?.message || fallback; }

  async function sendMessage(text) {
    if (busy) return;
    if (!apiKey) { openSettings(); settingsError.textContent = t("missingKey"); return; }
    const message = text.trim();
    if (!message) return;
    input.value = ""; input.style.height = "auto";
    addMessage("user", message); history.push({ role: "user", content: message });
    const assistant = addMessage("assistant", "", { typing: true });
    setBusy(true);
    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
        body: JSON.stringify({ model, messages: history, stream: true })
      });
      if (!response.ok) {
        let detail = t("requestFailed", response.status);
        try { detail = parseError(await response.json(), detail); } catch { /* The response may not contain JSON. */ }
        throw new Error(detail);
      }
      if (!response.body) throw new Error(t("noResponseStream"));
      const reader = response.body.getReader(), decoder = new TextDecoder();
      let buffer = "", answer = "", streamError = "", done = false;
      while (!done) {
        const chunk = await reader.read();
        done = chunk.done;
        buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !done });
        const lines = buffer.split(/\r?\n/); buffer = lines.pop() || "";
        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (!payload || payload === "[DONE]") continue;
          let data;
          try { data = JSON.parse(payload); } catch { continue; }
          if (data.error) { streamError = parseError(data, "模型返回错误。"); break; }
          const delta = data.choices?.[0]?.delta?.content;
          if (typeof delta === "string") answer += delta;
          else if (Array.isArray(delta)) answer += delta.map((part) => part?.text || "").join("");
          if (answer) assistant.bubble.textContent = answer;
        }
        if (streamError) break;
      }
      if (streamError) throw new Error(streamError);
      if (!answer.trim()) throw new Error(t("modelEmpty"));
      history.push({ role: "assistant", content: answer });
    } catch (error) {
      const messageText = error instanceof TypeError
        ? t("connectionError")
        : error.message || t("unknownError");
      assistant.item.classList.add("error"); assistant.bubble.textContent = messageText;
      if (history[history.length - 1]?.role === "user") history.pop();
    } finally {
      setBusy(false); input.focus(); conversation.scrollTop = conversation.scrollHeight;
    }
  }

  $("#openSettings").addEventListener("click", openSettings);
  $("#closeSettings").addEventListener("click", closeSettings);
  $("#cancelSettings").addEventListener("click", closeSettings);
  backdrop.addEventListener("click", (event) => { if (event.target === backdrop) closeSettings(); });
  document.addEventListener("keydown", (event) => { if (event.key === "Escape" && !backdrop.hidden) closeSettings(); });
  $("#toggleKey").addEventListener("click", (event) => {
    const visible = keyInput.type === "text"; keyInput.type = visible ? "password" : "text";
    event.currentTarget.textContent = visible ? t("reveal") : t("hide");
  });
  $("#settingsForm").addEventListener("submit", (event) => {
    event.preventDefault(); settingsError.textContent = "";
    const nextKey = keyInput.value.trim(), nextModel = modelInput.value.trim();
    if (!nextKey) { settingsError.textContent = t("requiredKey"); keyInput.focus(); return; }
    if (!nextModel) { settingsError.textContent = t("requiredModel"); modelInput.focus(); return; }
    try { endpoint = validateEndpoint(endpointInput.value.trim()); }
    catch (error) { settingsError.textContent = error.message; endpointInput.focus(); return; }
    apiKey = nextKey; model = nextModel;
    localStorage.setItem("zhiwen-model", model); localStorage.setItem("zhiwen-endpoint", endpoint);
    updateHeader(); closeSettings(); showToast(t("connectedToast")); input.focus();
  });
  $("#chatForm").addEventListener("submit", (event) => { event.preventDefault(); sendMessage(input.value); });
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = `${Math.min(input.scrollHeight, 150)}px`; });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); if (!busy) sendMessage(input.value); }
  });
  document.querySelectorAll(".suggestion").forEach((button) => button.addEventListener("click", () => {
    input.value = button.dataset.prompt || button.dataset[`prompt${language === "en" ? "En" : "Zh"}`] || ""; input.dispatchEvent(new Event("input")); input.focus();
    if (apiKey) sendMessage(input.value); else openSettings();
  }));
  $("#newChatButton").addEventListener("click", () => {
    if (busy) { showToast(t("newChatBusy")); return; }
    history = []; messagesEl.replaceChildren(); messagesEl.hidden = true; welcome.hidden = false;
    conversation.scrollTop = 0; input.value = ""; input.style.height = "auto"; input.focus();
  });
  $("#languageToggle").addEventListener("click", () => setLanguage(language === "zh" ? "en" : "zh"));
  setLanguage(language);
})();
</script>
</body>
</html>
